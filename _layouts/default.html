<!DOCTYPE html>
<html lang="{{ site.lang | default: 'es-ES' }}">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="author" content="Javier Cañadilla">
	<title>{{ page.title | default: site.title }}</title>

	{% seo %}

	<meta name="description"
		content="{{ page.description | default: site.description | default: site.github.project_tagline }}" />
	<meta name="keywords"
		content="{{ page.keywords | default: site.keywords | default: site.github.project_keywords }}" />
	<meta name="robots" content="index, follow" />

	<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#0d0d14" media="(prefers-color-scheme: dark)">

	<!--
		Modo de color. Por defecto manda el sistema (prefers-color-scheme, resuelto
		en CSS). Este script solo aplica una elección explícita ya guardada, y va
		aquí arriba a propósito: si se ejecutase más tarde se vería un parpadeo.
	-->
	<script>
		(function () {
			// Marca que hay JS: sin esta clase el contenido con .reveal se muestra
			// tal cual, en vez de quedarse invisible esperando al observador.
			document.documentElement.classList.add('js');
			try {
				var elegido = localStorage.getItem('modo-color');
				if (elegido === 'dark' || elegido === 'light') {
					document.documentElement.classList.add(elegido);
				}
			} catch (e) { /* almacenamiento bloqueado: se queda con el del sistema */ }
		})();
	</script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">

	<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

	{% feed_meta %}

	<!-- Google Analytics -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-2GZS74BB1Y"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag() { dataLayer.push(arguments); }
		gtag('js', new Date());
		gtag('config', 'G-2GZS74BB1Y');
	</script>
</head>

<body>
	<a class="skip-link" href="#contenido">Saltar al contenido</a>

	{% include navbar.html %}

	{% if page.layout == "home" %}
	{% include header.html %}
	{% endif %}

	<main id="contenido">
		{{ content }}
	</main>

	<footer class="site-footer">
		<div class="container site-footer__inner">
			<span>&copy; {{ site.time | date: "%Y" }} Javier Cañadilla Casco &mdash; Madrid</span>
			<span>Con &#10084; y &#9749;</span>
		</div>
	</footer>

	<button type="button" class="to-top js-to-top" aria-label="Volver arriba">
		<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
			stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
			<path d="M12 19V5" />
			<path d="m5 12 7-7 7 7" />
		</svg>
	</button>

	<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>

	<!-- Guiones sueltos que solo necesita una página, declarados en su front matter -->
	{% for guion in page.scripts %}
	<script src="{{ guion | relative_url }}" defer></script>
	{% endfor %}
</body>

</html>
