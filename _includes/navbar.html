<div class="site-nav">
	<div class="container site-nav__inner">

		<a class="brand" href="{{ '/' | relative_url }}">
			<span class="brand__mark" aria-hidden="true">JC</span>
			<span>Javier Cañadilla</span>
		</a>

		<nav class="nav-menu js-nav-menu" id="nav-menu" aria-label="Principal">
			<a class="nav-link" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Inicio</a>
			{% if page.layout == "home" %}
			<a class="nav-link" href="#sobre-mi">Sobre mí</a>
			<a class="nav-link" href="#trayectoria">Trayectoria</a>
			{% endif %}
			<a class="nav-link" href="{{ '/projects' | relative_url }}"{% if page.url contains '/projects' %} aria-current="page"{% endif %}>Proyectos</a>
			<a class="nav-link" href="{{ '/blog' | relative_url }}"{% if page.url contains '/blog' %} aria-current="page"{% endif %}>Posts</a>
		</nav>

		<div class="nav-tools">
			<div class="mode-toggle js-mode-toggle" role="group" aria-label="Modo de color">
				<button type="button" class="mode-toggle__btn js-mode" data-modo="light" aria-pressed="false">
					<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<circle cx="12" cy="12" r="4" />
						<path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
					</svg>
					<span class="visually-hidden">Modo claro</span>
				</button>
				<button type="button" class="mode-toggle__btn js-mode" data-modo="dark" aria-pressed="false">
					<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
						stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
					</svg>
					<span class="visually-hidden">Modo oscuro</span>
				</button>
			</div>

			{% if page.layout == "home" %}
			<a class="nav-cta" href="#contacto">Contacto</a>
			{% else %}
			<a class="nav-cta" href="mailto:{{ site.email }}?subject=%C2%A1Hola%20Javier!">Contacto</a>
			{% endif %}

			<button type="button" class="nav-burger js-nav-burger" aria-expanded="false" aria-controls="nav-menu">
				<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
					stroke-linecap="round" aria-hidden="true">
					<path d="M4 7h16M4 12h16M4 17h16" />
				</svg>
				<span class="visually-hidden">Abrir menú</span>
			</button>
